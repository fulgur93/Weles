# Statyczny „panel stagingowy” do pokazu fingerprintingu HTTP – żadnej logiki, żadnych kont.
server {
    listen 8080;
    server_tokens on;
    root /usr/share/nginx/html;
    add_header X-Powered-By "PHP/7.4.3" always;
    add_header X-Debug-Token "a1b2c3" always;
    add_header Set-Cookie "PHPSESSID=demo; path=/" always;
    add_header Set-Cookie "wordpress_test_cookie=WP%20Cookie%20check; path=/" always;
    location = / { return 302 /portal/; }
    location / { try_files $uri $uri/index.html =404; }
}
